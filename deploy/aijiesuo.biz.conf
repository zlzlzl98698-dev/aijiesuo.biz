# ==============================================================================
# Apache VirtualHost Reference Configuration for aijiesuo.biz (AI解锁)
# Place in /etc/apache2/sites-available/aijiesuo.biz.conf (Debian/Ubuntu)
# or /etc/httpd/conf.d/aijiesuo.biz.conf (RHEL/CentOS/AlmaLinux)
#
# Required modules:
#   a2enmod rewrite headers expires deflate ssl http2
# Optional (recommended):
#   a2enmod brotli
# ==============================================================================

<VirtualHost *:80>
    ServerName aijiesuo.biz
    ServerAlias www.aijiesuo.biz

    # Permanent 301 redirect from HTTP to canonical HTTPS host
    RewriteEngine On
    RewriteRule ^ https://aijiesuo.biz%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/aijiesuo.biz-http-error.log
    CustomLog ${APACHE_LOG_DIR}/aijiesuo.biz-http-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName aijiesuo.biz
    ServerAlias www.aijiesuo.biz
    ServerAdmin webmaster@aijiesuo.biz

    # Static VitePress build output directory (contents of docs/.vitepress/dist)
    DocumentRoot /var/www/aijiesuo.biz/dist

    # Enable HTTP/2 with HTTP/1.1 fallback
    Protocols h2 http/1.1

    <Directory /var/www/aijiesuo.biz/dist>
        Options -Indexes +FollowSymLinks -MultiViews
        AllowOverride All
        Require all granted

        DirectoryIndex index.html
        DirectorySlash On
    </Directory>

    # Canonical host redirect over HTTPS (www.aijiesuo.biz -> aijiesuo.biz)
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^aijiesuo\.biz$ [NC]
    RewriteRule ^ https://aijiesuo.biz%{REQUEST_URI} [R=301,L]

    # --------------------------------------------------------------------------
    # SSL / TLS Configuration (Update paths to your Let's Encrypt / CA certs)
    # --------------------------------------------------------------------------
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/aijiesuo.biz/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/aijiesuo.biz/privkey.pem

    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # OCSP Stapling (ensure SSLUseStaplingCache is configured in ssl.conf)
    SSLUseStapling          on
    SSLStaplingResponderTimeout 5
    SSLStaplingReturnResponderErrors off

    # --------------------------------------------------------------------------
    # HSTS Recommendation
    # Start with max-age=300 during initial verification; once HTTPS & all
    # subdomains are verified, increase to 31536000 (1 year).
    # --------------------------------------------------------------------------
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </IfModule>

    # --------------------------------------------------------------------------
    # Server-level Compression Fallback (also configured in .htaccess)
    # --------------------------------------------------------------------------
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml
    </IfModule>

    # --------------------------------------------------------------------------
    # Logging
    # --------------------------------------------------------------------------
    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/aijiesuo.biz-error.log
    CustomLog ${APACHE_LOG_DIR}/aijiesuo.biz-access.log combined
</VirtualHost>
</IfModule>
